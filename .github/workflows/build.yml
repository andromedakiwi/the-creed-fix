name: Build

# Compiles src/creedfix (dinput.dll) on every push / pull request and keeps the DLL as an artifact.
on:
  push:
    paths: ['src/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Build dinput.dll
        run: |
          make -C src/creedfix
          i686-w64-mingw32-objdump -p src/creedfix/dinput.dll | grep -E 'DirectInputCreate|DLL Name'
      - uses: actions/upload-artifact@v4
        with:
          name: creedfix-dinput
          path: src/creedfix/dinput.dll
